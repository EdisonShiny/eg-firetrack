# Every displayed band and word. Change values here, never in code.
# Band lists: a value is rounded half-up to a whole number (score / percent), then the first entry
# whose `max` is >= the value wins (max is inclusive; null = no upper limit). So with max 24 the
# edge is 24 -> first band, 25 -> next band, exactly as the tables in docs/technical.md.
data_window: {first_year: 2017, current_year: 2026, median_years: [2017, 2025]}

chance_words:            # 72-hour System outlook, percent
  - {max: 24, word: Unlikely}
  - {max: 49, word: Possible}
  - {max: 74, word: Likely}
  - {max: 100, word: Very likely}

compared_to_normal:      # anomaly vs median, percent
  - {max: 24, status: Normal}        # below +25%  (docs: "+25% to +100%" is Above average)
  - {max: 100, status: Above average} # +100% exactly is still Above average (logic-explained example)
  - {max: null, status: Unusual}
# How "Compared to normal" is measured and shown (pipeline/stats.py compare_to_normal).
# Baseline = median, over the full years, of harmonized fire cells in the SAME calendar window
# (current = 24 h, averaged over the same day +-3 days; 7d / 30d = same rolling window; month = same
# month up to the same date and hour; year = Jan 1 to the same date). The baseline is never below
# floor_cells, so a near-zero median cannot blow the percentage up.
compared_to_normal_rule:
  floor_cells: 10
  current_day_spread_days: 3      # current: same 24 h window on the same day +-3 days
  show_pct_up_to: 100             # up to +100% show the percent ("+18%"), above it the ratio ("3.2×")
  cap_ratio: 10                   # above 10× show ">10×"; tile small line: "vs usual · <status>"
  windows: [current, 7d, 30d, month, year]
  map_period_window: {current: current, 7d: 7d, 30d: 30d, 12m: year, 5y: year, all: year}
unusual_month_ratio: 2.0  # calendar cell >= 2 x its usual (median) month, usual > 0 -> outlined

levels:                  # risk score 0-100
  - {max: 24, level: 1, name: Low, short: monitor, directive: "Monitor daily. No deployment needed yet.", deploy_within_h: null, colour: "#22C55E"}
  - {max: 49, level: 2, name: Moderate, short: verify, directive: "Verify on the ground within 24 hours and prepare resources.", deploy_within_h: 24, colour: "#FACC15"}
  - {max: 74, level: 3, name: High, short: respond, directive: "Response required. Deploy within 6 hours.", deploy_within_h: 6, colour: "#F97316"}
  - {max: 100, level: 4, name: Critical, short: act now, directive: "Immediate response required. Deploy within 2 hours.", deploy_within_h: 2, colour: "#DC2626"}

risk_score_parts:
  chance_max: 40
  anomaly_max: 20
  anomaly_full_at_pct: 300
  intensity_max: 10
  frp_full_at_mw: 1000
  growth_full_at_pct: 100
  peat: {none: 0, shallow: 5, deep: 10}
  people_max: 15
  haze_border: 5

overrides:
  min_level_if_town_km_below: {km: 5, level: 3}
  min_level_if_hotspots_24h_at_least: {count: 50, level: 3}

stability: {downgrade_after_days_below: 2, close_after_days_without_hotspots: 3}

rescue_priority:
  weights: {risk: 0.5, people: 0.3, growth: 0.2}
  people_exposure: "100 - 2.5 * km_to_town, floor 0"
  growth_cap_pct: 100

trend_direction:         # week-on-week change, percent, over 3 weeks
  - {max: -11, word: Falling}        # below -10%  (-10% itself is Stable)
  - {max: 10, word: Stable}
  - {max: null, word: Rising}

fire_season_ratio: 1.25   # month is in the fire season when its median >= 1.25 x the mean of the 12 medians
prediction_range_pct: [15, 25, 35]
calendar_ramp: ["#D9F0D3", "#A6DBA0", "#FFE08A", "#FDB863", "#F4874B", "#E0452E", "#A50F15"]   # 7 quantile bins, low -> extreme
frp_dot_sizes_mw: {small_below: 10, large_above: 50}
very_intense_frp_mw: 100
fire_event: {radius_km: 2, window_h: 48, min_hotspots: 3}
sudden_increase: {ratio: 2.0, min_hotspots: 10}

# Words for the Analysis trend summary and Calendar facts (filled with numbers by pipeline/stats.py).
texts:
  tags: {past: PAST, now: NOW, next: NEXT, data: DATA}
  peak_in_view: {title: "Peak in this view: {month} {year}", text: "{count} hotspots; the largest years were {top_years}."}
  last_12_months: {title: "Last 12 months {pct} vs average year", text: "{count} hotspots vs {avg} in an average year ({first}-{last})."}
  month_vs_normal: {title: "{month_name} {year} is {pct} vs normal", text: "{count} hotspots vs a usual {month_name} of {usual} (anomaly vs median) - {status}."}
  year_so_far: {title: "{year} so far {pct} vs {prev}", text: "{span} {year}: {count} hotspots; same months of {prev}: {prev_count}."}
  next_months: {title: "Next 3 months: about {m1}, {m2}, {m3}", text: "{names}, the usual (median) count for each month (the System's 3-month model did not beat this baseline)."}
  next_months_model: {title: "Next 3 months: about {m1}, {m2}, {m3}", text: "{names}, System 3-month forecast from the last 3 months, the usual count and this month vs normal."}
  prediction_model: "Prediction = System 3-month forecast (LightGBM, checked against the usual count on 2025). Range ±15/25/35%."
  prediction_usual: "Prediction = the usual (median 2017-2025) count of each month: the System's 3-month model did not beat it on 2025."
  data_note: {title: "Both satellites, one record", text: "VIIRS sees about {k}x more fire cells than MODIS; the harmonized line merges both without double counting."}
  no_data: "No data"

# ---- Phase 6 rules (docs/technical.md "The logic" 4-9) ----
outlier_review: {jump_ratio: 10, max_level_until_reviewed: 3}   # event 24 h count >= 10 x the previous 24 h -> not Critical until reviewed
new_event_growth_pct: 100      # growth of an event with no hotspots the day before (shown as "new")
fuel_words: {none: "No peat", shallow: "Shallow peat (< 1 m)", deep: "Deep peat (> 1 m)"}
fuel_on: {none: "mineral soil (no peat)", shallow: "shallow peat", deep: "deep peat"}
alert_status: {notified_from_level: 3, notified: Notified, monitoring: Monitoring, closing: "Monitoring (no new hotspots)"}
check_words: {correct: "✓ correct", missed: "✗ missed", false_alarm: "✗ false alarm", none: "no check yet"}

notifications:                 # by level name
  Low:      {channel: "dashboard only", no_response: "none"}
  Moderate: {channel: "dashboard + email to the local agency", no_response: "none"}
  High:     {channel: "SMS + email to lead and support", no_response: "resend after 1 h"}
  Critical: {channel: "SMS + call + email + national agency", no_response: "escalate to the backup contact after 30 min"}

report:                        # situation report (System text); {placeholders} are filled by pipeline/reports.py
  situation: "{hotspots} hotspots detected in the last 24 h ({growth} vs yesterday), on {peat}. Nearest town {town} {town_km} km; nearest road {road}. {rain}"
  rain_days: "No rain for {days} days."
  rain_recent: "Rain in the last 24 h."
  rain_unknown: "Rain data not available."
  road_unknown: "not known (no road data yet)"
  assessment: "Compared with a normal {month}, activity is {anomaly} vs usual. The System gives a {chance}% chance of further spreading within 72 hours ({words}). Risk score {score}/100 → Level {level} {name}."
  assessment_fallback_note: " (chance from compared-to-normal fallback)"
  critical_add: " Rescue priority P{rank}: assign about {share}% of available rescue teams."
  growth_new: "new"

rescue_risk_texts:
  no_events: "No active fire events in this area. Monitor daily."
  people: "{n} fire event(s) within {km} km of a town."
  fuel_area_note: "Deepest peat in the area ({source})."
  fuel_event_note: "Under the highest-scoring fire event ({source})."
