# Runs every day at 06:00 Malaysia time (22:00 UTC the day before) and refreshes the data.
# Vercel's GitHub integration redeploys the site automatically when this workflow pushes new data.
#
# Secrets (Settings > Secrets and variables > Actions):
#   FIRMS_MAP_KEY        required - NASA FIRMS map key
#   TELEGRAM_BOT_TOKEN   optional - "Notify nearby teams" / alert messages
#   TELEGRAM_CHAT_ID     optional
# If FIRMS_MAP_KEY is missing or FIRMS fails, the run still succeeds: existing data is kept and the
# reason is saved in meta.json (shown in the site's Data status popover).
name: Daily data update

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Build data
        run: |
          if [ -z "$FIRMS_MAP_KEY" ]; then
            echo "::warning::FIRMS_MAP_KEY secret is not set - existing data is re-exported, no new detections."
          fi
          python -m pipeline.run_daily --export web/public/data
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save new data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/data data/processed
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily data update"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
